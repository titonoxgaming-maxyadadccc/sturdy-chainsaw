name: TITONOX APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TITONOX APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ZIP project को extract करो
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            mkdir -p android-project
            unzip -o "$ZIP_FILE" -d android-project

            echo "Extracted files:"
            find android-project -maxdepth 3 -type f | head -100
          else
            echo "No ZIP found. Assuming project is already extracted."
            mkdir -p android-project
            cp -r ./* android-project/ 2>/dev/null || true
          fi

      # ZIP के अंदर nested folder हो तो actual Android project खोजो
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Searching files:"
            find android-project -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # Debug keystore
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Build
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===================================="
          echo "ANDROID PROJECT"
          echo "===================================="

          pwd
          ls -la

          echo "===================================="
          echo "BUILDING APK"
          echo "===================================="

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # APK locate
      - name: Locate APK
        shell: bash
        run: |
          echo "Generated APKs:"

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      # APK prepare
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" release/TITONOX-debug.apk

          echo "APK ready:"
          ls -lh release/TITONOX-debug.apk

      # Downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITONOX-APK
          path: release/TITONOX-debug.apk
          if-no-files-found: error
